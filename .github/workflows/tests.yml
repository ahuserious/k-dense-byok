name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vendored-dist:
    name: vendored builder dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Install vendored workspace dependencies
        working-directory: server/vendor/pipeline-engine
        run: bun install --frozen-lockfile
      - name: Test vendored dist gate
        run: node --test scripts/*.test.mjs
        env:
          KADY_SOCKET_TESTS: "1"
      - name: Check ownership inventory uniqueness
        run: node scripts/ownership-check.mjs
      - name: Authorize pull-request changes for the writing lane
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^lane/([A-Za-z][A-Za-z0-9]*)- ]]; then
            echo "ownership-check: FAIL (PR branch must use lane/<id>-<description>)" >&2
            exit 2
          fi
          writer="$(printf '%s' "${BASH_REMATCH[1]}" | tr '[:lower:]' '[:upper:]')"
          node scripts/ownership-check.mjs --writer "$writer" --base "$BASE_SHA"
      - name: Note changed-path authorization skip on push
        if: github.event_name == 'push'
        run: echo "ownership-check changed-path authorization skipped on push; no PR base SHA is available"
      - name: Build vendored builder dist
        run: npm run build:vendored-dist
      - name: Check vendored builder dist freshness
        run: npm run check:vendored-dist

  backend:
    name: backend (vitest, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: Run tests
        working-directory: server
        run: npm test
      - name: Inspect private dag-fusion-drive package
        working-directory: server/pi-packages/dag-fusion-drive
        run: npm pack --dry-run --json

  frontend:
    name: frontend (vitest, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      # Upstream main has unrelated existing React 19 lint failures. Keep this
      # feature gate strict without pretending those baseline files are clean.
      - name: Lint DAG Workflows changes
        working-directory: web
        run: npm run lint:dag
      - name: Run tests
        working-directory: web
        run: npm run test
      - name: Production build
        working-directory: web
        run: npm run build

  launcher-smoke:
    name: launcher --check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run start.sh --check
        if: runner.os != 'Windows'
        run: ./start.sh --check
      - name: Run start.cmd --check
        if: runner.os == 'Windows'
        shell: cmd
        run: start.cmd --check
