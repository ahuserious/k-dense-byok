# Job A runs the repository's Playwright process on a GitHub-hosted runner and records a runner
# fingerprint. It is the hosted-runner proof path; it deliberately does not use `--browser cloud`.
# It runs `--project=chromium` -- the mocked tier only -- because it is the job the wave's
# 218-substantive floor result is measured on. The unmocked Wave-F click-through tier has its own
# workflow, .github/workflows/wave-f-e2e.yml. The full-inventory pins are still asserted here, by the
# `Assert the full E2E inventory` step, which lists both projects without running either.
#
# Job B is exploratory AND ITS QUESTION IS NOW ANSWERED, in the negative. The action's own accepted-
# input list contains no repository path, glob, or config file -- only Stably-platform selectors
# and a target override -- so nothing in its contract consumes this repository's
# e2e/*.spec.ts, and a green Job B is not evidence that this suite ran in Stably Cloud. The job stays
# (non-blocking) as the place that records that finding against a real API response rather than
# against a doc page. See the comment block inside the `stably-cloud` job for the full reasoning.
#
# Honest one-liner for any report that cites this workflow:
#   remote execution: yes (Job A, GitHub-hosted ubuntu runner). Stably-Cloud browsers: no.
name: Stably hosted-runner E2E

on:
  workflow_dispatch:
    inputs:
      grep:
        description: Optional Playwright grep expression
        required: false
        type: string
      workers:
        description: Playwright worker count
        required: false
        default: "2"
        type: string
  push:
    branches:
      - "integration/**"

permissions:
  contents: read

jobs:
  github-runner:
    name: GitHub-hosted runner
    runs-on: ubuntu-latest
    # Derived from the measured phases of run 32006038040 (a clean 24m10s job) rather than rounded
    # up from the previous 45:
    #   pre-suite steps excluding the browser install   119s measured, x1.5 runner variance =  3m
    #     (round 2 added `Assert the full E2E inventory` to this phase: a `--list` collection, 1.4s
    #      warm on the author's machine, no browser and no preview. The 3m allowance already carries
    #      ~61s of headroom over the 119s measurement, so the ceiling is unchanged.)
    #   browser install, Stably                         its own budget                      =  8m
    #   browser install, Playwright fallback            its own budget                      =  3m
    #   the suite                                       its own budget                      = 35m
    #   post-suite steps (counts, manifest, scan, upload) 119s measured, x1.5 variance      =  3m
    #   runner scheduling slop                                                              =  1m
    #                                                                              phase total 53m
    # 54m sits one minute above that 53m sum, which is the property that matters: every component
    # now has a tighter budget of its own, so this ceiling should never be the thing that fires.
    # When it does fire, that is itself the finding -- something outside every budgeted phase.
    #
    # `env` is not available in the job-level context, so this cannot be an expression the way the
    # step budgets below are; it has to be a literal. `Check job timeout budget` is what keeps the
    # literal and the budgets honest -- it reads this number back out of this file, sums the phase
    # variables, and fails in the first seconds of the job if the margin is gone. Change either the
    # ceiling or a phase budget alone and that step says so.
    timeout-minutes: 54
    env:
      # Single source of truth for each phase: the step budgets below, the figure the job summary
      # compares the observed suite wall clock against, and the sum the ceiling is checked against.
      # The three with no step of their own are the measured phases, padded for runner variance.
      E2E_PRE_SUITE_BUDGET_MINUTES: "3"
      E2E_SUITE_TIMEOUT_MINUTES: "35"
      E2E_BROWSER_INSTALL_TIMEOUT_MINUTES: "8"
      E2E_BROWSER_FALLBACK_TIMEOUT_MINUTES: "3"
      E2E_POST_SUITE_BUDGET_MINUTES: "3"
      E2E_RUNNER_SLOP_MINUTES: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            web/package-lock.json

      # Before anything expensive, so a budget that no longer fits is a ten-second failure with a
      # printed table rather than something discovered 40 minutes in.
      - name: Check job timeout budget
        run: node e2e/check-job-timeout-budget.mjs

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install vendored engine dependencies
        working-directory: server/vendor/pipeline-engine
        run: bun install --frozen-lockfile

      - name: Build vendored builder dist
        run: npm run build:vendored-dist

      - name: Check vendored builder dist
        run: npm run check:vendored-dist

      # THE HOSTED FULL-INVENTORY ASSERTION. The two suite steps below run `--project=chromium`, which
      # e2e/item-count-reporter.ts classifies as a filtered run, so neither of them asserts the pins
      # any more. Before round 2 this job was the run that did assert them on a machine that is not
      # the author's laptop, and losing that would have traded one defect for another.
      #
      # An unfiltered `--list` collects BOTH projects and the reporter's `onBegin` runs the full
      # check: per-file item counts, substantive, thin, fixme and skip. It throws "E2E inventory
      # drifted" here, on the runner, in a step that starts no browser, boots no preview and takes a
      # few seconds. Collection only -- it runs no test.
      #
      # Invoked through the CLI entry point rather than through the `npx` form deliberately.
      # scripts/hosted-evidence-reporter.test.mjs:92 counts the `npx` invocations in this file and
      # pins them at 2, because this workflow must run the SUITE exactly twice (the unfiltered leg and
      # the --grep leg, one of which is always skipped). A collection is not a suite run and must not
      # be counted as one; this form keeps that pin measuring what it means. That test file belongs to
      # another lane, so the workflow adapts to the pin rather than the pin to the workflow.
      - name: Assert the full E2E inventory
        run: node node_modules/@playwright/test/cli.js test --list

      # `--with-deps` pulls 114 MB of apt archives (the full browser dependency set, not just
      # Chromium's). Run 32006038040 fetched them in 3s at 33.5 MB/s; run 32094043747 fetched the
      # identical 114 MB in 40m21s at 47.2 kB/s from a degraded azure.archive.ubuntu.com mirror and
      # consumed the whole job budget before the suite could start. This cap is 10x the measured
      # cost and 5x below that pathology. A timeout sets this step's `outcome` to failure, which is
      # what the fallback below keys on -- and the fallback only needs Chromium's own dependencies,
      # which the runner image already ships at the required versions, so it downloads almost
      # nothing even when the mirror is degraded.
      - name: Install Chromium with Stably
        id: stably-browser-install
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(env.E2E_BROWSER_INSTALL_TIMEOUT_MINUTES) }}
        run: npx --yes stably@4.12.28 install --with-deps > stably-install.log 2>&1

      # This is the one step that runs only when the mirror has already misbehaved, so leaving it
      # unbounded would reintroduce the failure the cap above removes -- and leaving it fatal would
      # be worse than that failure. Without `continue-on-error` a slow pool, a stale dpkg lock left
      # by the capped install, or a CDN hiccup ends the job here, before the preview, the suite, the
      # manifest or the upload: a red job with no evidence at all. With it, a missing browser
      # instead fails the suite step, `Record browser installation method` records that neither
      # installer succeeded, and every `if: always()` step below still writes its evidence.
      - name: Install Chromium with Playwright fallback
        id: playwright-browser-install
        if: steps.stably-browser-install.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(env.E2E_BROWSER_FALLBACK_TIMEOUT_MINUTES) }}
        run: npx playwright install --with-deps chromium > playwright-install.log 2>&1

      - name: Record browser installation method
        id: browser-install
        if: always()
        env:
          STABLY_INSTALL_OUTCOME: ${{ steps.stably-browser-install.outcome }}
          PLAYWRIGHT_INSTALL_OUTCOME: ${{ steps.playwright-browser-install.outcome }}
        run: |
          # Three states, not two. The fallback can now fail without ending the job, so recording
          # "playwright-fallback" whenever Stably did not succeed would name an installer that may
          # itself have failed -- and the evidence would assert a browser was installed by a path
          # that did not install one.
          if [[ "$STABLY_INSTALL_OUTCOME" == "success" ]]; then
            install_method="stably"
          elif [[ "$PLAYWRIGHT_INSTALL_OUTCOME" == "success" ]]; then
            install_method="playwright-fallback"
          else
            install_method="none"
          fi
          {
            echo "selected=$install_method"
            echo "stably_outcome=$STABLY_INSTALL_OUTCOME"
            echo "playwright_outcome=$PLAYWRIGHT_INSTALL_OUTCOME"
          } > browser-install-method.txt
          cat stably-install.log
          if [[ -f playwright-install.log ]]; then
            cat playwright-install.log
          fi
          echo "method=$install_method" >> "$GITHUB_OUTPUT"

      - name: Collect runner fingerprint fields
        run: |
          {
            echo "RUNNER_HOSTNAME=$(hostname)"
            echo "RUNNER_UNAME=$(uname -a)"
            echo "RUNNER_EGRESS_IPV4=$(curl -4 -fsS --max-time 20 https://api.ipify.org)"
            echo "RUNNER_EGRESS_IPV6=$(curl -6 -fsS --max-time 20 https://api64.ipify.org 2>/dev/null || true)"
            echo "RUNNER_NODE_VERSION=$(node --version)"
            echo "RUNNER_BUN_VERSION=$(bun --version)"
          } >> "$GITHUB_ENV"

      - name: Record runner fingerprint
        run: |
          jq -n '{
            hostname: env.RUNNER_HOSTNAME,
            uname: env.RUNNER_UNAME,
            egressIpv4: env.RUNNER_EGRESS_IPV4,
            egressIpv6: (if env.RUNNER_EGRESS_IPV6 == "" then null else env.RUNNER_EGRESS_IPV6 end),
            GITHUB_RUN_ID: env.GITHUB_RUN_ID,
            GITHUB_SHA: env.GITHUB_SHA,
            nodeVersion: env.RUNNER_NODE_VERSION,
            bunVersion: env.RUNNER_BUN_VERSION
          }' > runner-fingerprint.json
          cat runner-fingerprint.json

      # Not --no-build-dist: the manifest written by the build step above
      # carries buildEnv {NODE_ENV: null, PORT: null}, while the preview checks
      # the bundle under NODE_ENV=production and PORT=13091. The comparison is
      # strict, so the skip-build path can never pass here. The locked
      # --if-stale build rebuilds the bundle once under the preview build
      # environment instead.
      - name: Start preview listener sampler
        run: |
          cat > preview-listener-sampler.sh <<'SAMPLER'
          #!/usr/bin/env bash
          for i in $(seq 1 60); do
            sleep 5
            echo "=== sample $i"
            ss -ltnp 2>/dev/null | grep -E '(18000|13000|13091)'
            echo "--- lsof 13000: $(lsof -nP -iTCP:13000 -sTCP:LISTEN -t 2>&1 | tr '\n' ' ')"
          done
          SAMPLER
          nohup bash preview-listener-sampler.sh > preview-listener-samples.log 2>&1 &
          echo $! > preview-listener-sampler.pid

      - name: Start hermetic preview
        id: preview
        shell: bash
        run: |
          set +e
          node scripts/preview-up.mjs \
            --backend-port 18000 \
            --frontend-port 13000 \
            --engine-port 13091 > preview-up.log 2>&1
          preview_exit=$?
          set -e
          cat preview-up.log
          exit "$preview_exit"

      - name: Stop preview listener sampler
        if: always()
        run: |
          test ! -f preview-listener-sampler.pid || kill "$(cat preview-listener-sampler.pid)" 2>/dev/null || true

      - name: Preview listeners (failure diagnostics)
        if: failure() && steps.preview.outcome == 'failure'
        run: |
          echo "--- listener samples taken while preview-up ran"
          cat preview-listener-samples.log 2>/dev/null || echo "(no samples)"
          lsof -v 2>&1 | head -3 || true
          lsof -nP -iTCP:18000 -iTCP:13000 -iTCP:13091 -sTCP:LISTEN || echo "(lsof reported no listeners)"
          ss -ltnp 2>/dev/null | grep -E '(18000|13000|13091)' || echo "(ss reported no matching listeners)"
          pgrep -af 'next|bun|tsx|supervisor' || echo "(no preview processes)"

      - name: Preview log (failure diagnostics)
        if: failure() && steps.preview.outcome == 'failure'
        run: |
          preview_log="$(sed -n 's/^Preview log: //p' preview-up.log | tail -1)"
          if [ -n "$preview_log" ] && [ -f "$preview_log" ]; then
            echo "--- $preview_log (last 400 lines)"
            tail -n 400 "$preview_log"
          else
            echo "(no preview log path found)"
          fi

      - name: Warm the main page
        run: curl --fail --silent --show-error http://127.0.0.1:13000/ > /dev/null

      - name: Validate suite inputs
        env:
          INPUT_WORKERS: ${{ inputs.workers || '2' }}
        run: |
          worker_count="${INPUT_WORKERS:-2}"
          if [[ ! "$worker_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "workers must be a positive integer, got: $worker_count" >&2
            exit 2
          fi
          {
            echo "E2E_WORKERS=$worker_count"
            echo "E2E_RUN_STARTED_AT=$(node -e 'process.stdout.write(String(Date.now()))')"
            echo "E2E_SUITE_NAME=sds-outer-loop-ci-${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_ENV"

      # A step budget, not a job budget. When `timeout-minutes` on the job fires, the job is
      # cancelled: no counts, no manifest, and a "cancelled" conclusion that reads like a person
      # pressed a button. When it fires here the step merely fails, every `if: always()` step below
      # still runs, and the summary records that the suite exceeded its budget.
      - name: Run complete Playwright suite
        id: suite-all
        if: inputs.grep == ''
        timeout-minutes: ${{ fromJSON(env.E2E_SUITE_TIMEOUT_MINUTES) }}
        env:
          CI: "1"
          KADY_E2E_BASE_URL: http://127.0.0.1:13000
          FORCE_COLOR: "0"
          NO_COLOR: "1"
          STABLY_API_KEY: ${{ secrets.STABLY_API_KEY }}
          STABLY_PROJECT_ID: ${{ secrets.STABLY_PROJECT_ID }}
        # `--project=chromium`, added in Wave-F round 2. The committed config gained a second project
        # (`wave-f`, the unmocked click-through tier), and an unfiltered run collects BOTH of them:
        # every Wave-F item from all five lanes was running inside THIS job, under this budget, with
        # `video: "on"`. That made the wave's "a Wave-F failure cannot mask the floor result" claim
        # false -- one flaky unmocked spec from any lane turned the floor job red. This job is the
        # FLOOR job; the floor is the mocked tier's 218-substantive count; the Wave-F tier has its own
        # workflow (.github/workflows/wave-f-e2e.yml) and its own budget.
        #
        # `--project=` makes this a filtered run, so e2e/item-count-reporter.ts (correctly) stops
        # asserting the full inventory here. The `Assert the full E2E inventory` step above is what
        # keeps that assertion on this runner -- do not delete it and leave this flag.
        run: npx playwright test --project=chromium --workers="$E2E_WORKERS" --trace on > stably-test.log 2>&1

      - name: Run filtered Playwright suite
        id: suite-grep
        if: inputs.grep != ''
        timeout-minutes: ${{ fromJSON(env.E2E_SUITE_TIMEOUT_MINUTES) }}
        env:
          CI: "1"
          KADY_E2E_BASE_URL: http://127.0.0.1:13000
          FORCE_COLOR: "0"
          NO_COLOR: "1"
          STABLY_API_KEY: ${{ secrets.STABLY_API_KEY }}
          STABLY_PROJECT_ID: ${{ secrets.STABLY_PROJECT_ID }}
          INPUT_GREP: ${{ inputs.grep }}
        # `--project=chromium` for the same reason as the step above: this job runs the mocked tier
        # that the substantive floor is measured on, and nothing else.
        run: npx playwright test --project=chromium --workers="$E2E_WORKERS" --grep "$INPUT_GREP" --trace on > stably-test.log 2>&1

      # Stamped here rather than inferred later, so the elapsed figure covers the suite step and
      # nothing else, whichever of the two suite steps above ran.
      - name: Stamp suite elapsed time
        if: always()
        run: |
          if [[ -z "${E2E_RUN_STARTED_AT:-}" ]]; then
            echo "suite start was never stamped; elapsed suite time is not recoverable" >&2
            exit 0
          fi
          suite_ended_at="$(node -e 'process.stdout.write(String(Date.now()))')"
          echo "E2E_SUITE_ELAPSED_SECONDS=$(( (suite_ended_at - E2E_RUN_STARTED_AT) / 1000 ))" >> "$GITHUB_ENV"

      # A step stopped by `timeout-minutes` leaves the Playwright process tree behind, exactly as
      # the cancelled run 32094043747 did, and those orphans keep writing into and deleting from the
      # artifact directory the evidence scan walks. The script explains the failure it prevents.
      - name: Quiesce leftover suite processes
        if: always()
        run: node e2e/quiesce-suite-processes.mjs

      - name: Enforce hosted evidence log size limit
        id: evidence-log-cap
        if: always()
        run: node scripts/hosted-evidence-log-cap.mjs stably-test.log

      - name: Stop hermetic preview
        if: always()
        run: node scripts/preview-down.mjs

      - name: Extract suite counts
        if: always() && steps.evidence-log-cap.outcome == 'success'
        run: |
          passed="$(grep -Eo '[0-9]+ passed' stably-test.log 2>/dev/null | tail -1 | cut -d' ' -f1 || true)"
          failed="$(grep -Eo '[0-9]+ failed' stably-test.log 2>/dev/null | tail -1 | cut -d' ' -f1 || true)"
          skipped="$(grep -Eo '[0-9]+ (skipped|fixme)' stably-test.log 2>/dev/null | tail -1 | cut -d' ' -f1 || true)"
          {
            echo "E2E_PASSED=${passed:-not detected}"
            echo "E2E_FAILED=${failed:-not detected}"
            echo "E2E_SKIPPED=${skipped:-not detected}"
          } >> "$GITHUB_ENV"

      - name: Record suite outcome
        if: always()
        env:
          SUITE_ALL_OUTCOME: ${{ steps.suite-all.outcome }}
          SUITE_GREP_OUTCOME: ${{ steps.suite-grep.outcome }}
        run: |
          suite_outcome="$SUITE_ALL_OUTCOME"
          if [[ "$SUITE_GREP_OUTCOME" != "skipped" ]]; then suite_outcome="$SUITE_GREP_OUTCOME"; fi
          echo "E2E_SUITE_OUTCOME=${suite_outcome:-not run}" >> "$GITHUB_ENV"
          if [[ "$suite_outcome" == "success" && "$E2E_FAILED" == "not detected" ]]; then echo "E2E_FAILED=0" >> "$GITHUB_ENV"; fi

      - name: Write hosted evidence manifest
        if: always()
        env:
          INPUT_GREP: ${{ inputs.grep }}
          STABLY_API_KEY: ${{ secrets.STABLY_API_KEY }}
          STABLY_PROJECT_ID: ${{ secrets.STABLY_PROJECT_ID }}
        run: node scripts/hosted-evidence-manifest.mjs

      - name: Write GitHub-runner result summary
        if: always()
        run: |
          {
            echo "## GitHub-hosted Stably E2E"
            echo
            echo "- Outcome: $E2E_SUITE_OUTCOME"
            echo "- Passed: $E2E_PASSED"
            echo "- Failed: $E2E_FAILED"
            echo "- Skipped/fixme: $E2E_SKIPPED"
          } >> "$GITHUB_STEP_SUMMARY"

      # Reads the NDJSON streamed by e2e/spec-timing-reporter.ts. It is written per finished test,
      # so a suite stopped by its budget still reports timings for the part that did run.
      - name: Summarise per-spec timings
        if: always()
        run: node e2e/spec-timing-summary.mjs --top 10

      - name: Write GitHub-runner evidence summary
        if: always()
        env:
          BROWSER_INSTALL_METHOD: ${{ steps.browser-install.outputs.method }}
        run: |
          {
            echo "- Stably run metadata: redacted hosted-evidence-manifest.json"
            echo "- Browser installer: ${BROWSER_INSTALL_METHOD:-not completed}"
            echo "- Execution host evidence: runner-fingerprint.json artifact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan hosted evidence artifacts
        id: artifact-scan
        if: always()
        env:
          STABLY_API_KEY: ${{ secrets.STABLY_API_KEY }}
          STABLY_PROJECT_ID: ${{ secrets.STABLY_PROJECT_ID }}
        run: node scripts/hosted-evidence-scan.mjs

      - name: Print scrubbed Stably Playwright log
        if: always() && steps.artifact-scan.outcome == 'success'
        run: test ! -f stably-test.scrubbed.log || cat stably-test.scrubbed.log

      - name: Upload GitHub-runner evidence
        if: always() && steps.artifact-scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: stably-github-runner-${{ github.run_id }}
          if-no-files-found: error
          include-hidden-files: true
          path: hosted-evidence-bundle.tar

  stably-cloud:
    # WHAT THIS JOB ACTUALLY DOES -- rewritten from evidence, not from the doc page the original spike
    # was written against.
    #
    # `stablyai/stably-runner-action@v4` accepts exactly these inputs (the list the action itself printed
    # when it rejected the original arguments):
    #
    #   api-key, project-id, run-group-name, env-overrides, test-group-id, test-suite-id,
    #   domain-override, url-replacement, github-comment, github-token, async, environment,
    #   variable-overrides, note
    #
    # Every input that SELECTS work is a Stably-platform selector (test-suite-id, test-group-id,
    # run-group-name). `run-group-name` is documented by the action as "The Playwright project name
    # to run (v2 only)": it filters platform-side runs by Playwright project name and does not
    # consume this checkout. Every input that AIMS it is a target selector (domain-override,
    # url-replacement). There is no input that takes a repository path, a glob, or a config file.
    #
    #   => NOTHING IN THIS ACTION'S CONTRACT CONSUMES THIS REPOSITORY'S e2e/*.spec.ts.
    #   => A GREEN JOB B IS THEREFORE **NOT** EVIDENCE THAT THIS SUITE RAN IN STABLY CLOUD.
    #      It would be evidence that tests authored in the Stably platform ran there.
    #
    # Two concrete defects in the original spike, both fixed here:
    #   1. It passed `playwright-project-name: chromium`, which is not in the list above. The action
    #      warned ("Unexpected input(s) 'playwright-project-name'") and ignored it, so the argument that
    #      was supposed to make this job meaningful never did anything.
    #   2. It failed in 7 seconds on every run -- including all six greens -- with
    #      "Input required and not supplied: api-key", because the secrets were not configured at the
    #      time. A red job that means "the owner has not set a secret" is noise. It is now a legible
    #      skip with the reason written into the job summary; the action step runs only when both
    #      secrets are present.
    #
    # WHY THIS JOB IS `workflow_dispatch` ONLY. `STABLY_API_KEY` and `STABLY_PROJECT_ID` ARE now set
    # on ahuserious/k-dense-byok (both stamped 2026-08-19T03:08:25Z; names read from
    # `gh secret list`, no value read). An earlier F10 report said they were unset -- that was wrong,
    # and it hid a cost consequence: with the credential gate satisfied, the action step above is no
    # longer skipped, so leaving this job on the `push: integration/**` trigger would spend a paid
    # Stably run on every integration push. This job's own analysis, three paragraphs up, is that no
    # input to that action names a file in this repository, so those runs cannot be evidence for this
    # suite. Spending one has to be a deliberate act, so the job runs only when a person dispatches
    # the workflow. Remove this `if` when someone actually wants a run per push.
    #
    # Secrets needed on ahuserious/k-dense-byok, by NAME only: STABLY_API_KEY, STABLY_PROJECT_ID.
    # (Owner action; project "My Team fc881" per `stably whoami`.) Their VALUES never appear here, in a
    # log, or in the summary -- the gate below tests emptiness and exports a boolean.
    name: Stably Cloud action spike
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch'
    # No `needs` dependency: this spike starts in parallel with Job A.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # `[ -n "$X" ]` only. Nothing is echoed, printed, or written anywhere except as true/false.
      - name: Check Stably credentials are configured
        id: stably-credentials
        env:
          STABLY_API_KEY: ${{ secrets.STABLY_API_KEY }}
          STABLY_PROJECT_ID: ${{ secrets.STABLY_PROJECT_ID }}
        run: |
          missing=""
          if [ -z "$STABLY_API_KEY" ]; then missing="STABLY_API_KEY"; fi
          if [ -z "$STABLY_PROJECT_ID" ]; then missing="${missing:+$missing, }STABLY_PROJECT_ID"; fi
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run exploratory Stably Cloud action
        id: stably
        if: steps.stably-credentials.outputs.configured == 'true'
        uses: stablyai/stably-runner-action@v4
        with:
          api-key: ${{ secrets.STABLY_API_KEY }}
          project-id: ${{ secrets.STABLY_PROJECT_ID }}
          env-overrides: |
            KADY_E2E_BASE_URL: http://127.0.0.1:13000
          async: false
          github-comment: false

      - name: Write Stably Cloud spike summary
        if: always()
        env:
          CREDENTIALS_CONFIGURED: ${{ steps.stably-credentials.outputs.configured }}
          CREDENTIALS_MISSING: ${{ steps.stably-credentials.outputs.missing }}
          ACTION_OUTCOME: ${{ steps.stably.outcome }}
          STABLY_SUCCESS: ${{ steps.stably.outputs.success }}
          STABLY_RUN_ID: ${{ steps.stably.outputs.runId }}
          STABLY_TEST_SUITE_RUN_ID: ${{ steps.stably.outputs.testSuiteRunId }}
        run: |
          {
            echo "## Stably Cloud action spike"
            echo
            if [ "$CREDENTIALS_CONFIGURED" != "true" ]; then
              printf '%s\n' "- **Skipped, not failed.** Missing repository secret(s): ${CREDENTIALS_MISSING:-unknown}."
              printf '%s\n' "- Set them on this repository to run the spike. Names only; no value is ever printed by this workflow."
              echo
            fi
            printf '%s\n' "- Action outcome: ${ACTION_OUTCOME:-not run}"
            printf '%s\n' "- success: ${STABLY_SUCCESS:-not recorded}"
            printf '%s\n' "- runId: ${STABLY_RUN_ID:-not recorded}"
            printf '%s\n' "- testSuiteRunId: ${STABLY_TEST_SUITE_RUN_ID:-not recorded}"
            echo
            echo "### What a green here would and would not prove"
            printf '%s\n' "- \`stablyai/stably-runner-action@v4\` selects work by \`test-suite-id\` / \`test-group-id\` / \`run-group-name\` and aims it with \`domain-override\` / \`url-replacement\`. It accepts no repository path, glob, or config file. \`run-group-name\` filters platform-side runs by Playwright project name and does not consume this checkout."
            printf '%s\n' "- **Nothing in its contract consumes this repository's \`e2e/*.spec.ts\`.** A green Job B is NOT evidence that this suite ran in Stably Cloud."
            printf '%s\n' "- Hosted execution of THIS suite is proven by Job A (GitHub-hosted ubuntu runner) and by the \`wave-f-e2e.yml\` workflow, not by this job."
            printf '%s\n' "- The Stably project link is per-directory: an unlinked directory runs LOCAL browsers while looking exactly like a cloud run. Verify the link and \`stably runs list\` before believing any \"cloud\" result."
          } >> "$GITHUB_STEP_SUMMARY"
