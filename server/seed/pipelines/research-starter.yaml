# Seeded pipeline — imported from the DAG-Pipelines branch (source: kdense-starter).
#
# This file is deliberately kept in the ORIGINAL legacy pipeline dialect rather
# than being hand-written as a typed document. It is the one seed that proves the
# import path end to end: `server/src/workflows/seed-pipelines.ts` hands these
# bytes to `previewLegacyPipelineWorkflow`, the same translator that serves
# `POST /dag-workflow-imports/legacy-pipeline/preview`, and the typed document it
# returns is what lands in the project's workflow library.
#
# Adaptations from the source are recorded in docs/adr/F7-seed-import.md: the
# product-specific name and description were replaced with capability names,
# prompt prose was tightened without changing the three-step dependency chain,
# and `interactive` changed from `true` to `false` because NodeSpec v1 has no
# human gate and the translator rejects that flag rather than dropping it.
name: Research Starter
description: |
  A three-step research pipeline: scope the question, gather and synthesize the
  findings, then write the result up. A gentle starting point for a new project —
  open it, read the three prompts, and edit them into your own question. Imported
  legacy workflows start with a $0 workflow cost limit, so increase the limit
  after review before launching a provider-backed run.
provider: pi
interactive: false

nodes:
  - id: scope
    prompt: |
      You are starting a research task. Restate the request in your own words,
      list the key sub-questions worth investigating, and note every assumption
      you are making.

      Request: $ARGUMENTS
    model: openrouter/anthropic/claude-opus-4.8

  - id: research
    prompt: |
      Using the scope below, gather the relevant facts and synthesize the most
      important findings. Be concrete, and say what each finding rests on.

      Scope: $scope.output
    depends_on: [scope]
    model: openrouter/anthropic/claude-opus-4.8

  - id: writeup
    prompt: |
      Write a clear, well-structured summary of the research. Lead with the
      answer, then the supporting detail, then the open questions.

      Findings: $research.output
    depends_on: [research]
    model: openrouter/anthropic/claude-opus-4.8
