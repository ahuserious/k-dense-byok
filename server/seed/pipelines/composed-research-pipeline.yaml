        characterize the dataset well enough that the planned tests are known to be applicable

      Re-derive whether the work actually achieves that goal. Hunt for the specific
      failure this phase is prone to: a profile that never checks the assumptions the next phase's tests depend on

      Be adversarial. FAIL it if the next phase could not proceed unambiguously on
      what this phase produced. Answer with exactly "PASS" or "FAIL: <reasons>".

  - id: eda-verify-3
    name: Verify exploratory analysis (3 of 3)
    kind: agent
    terminal: false
    position: { x: 80, y: 740 }
    workspace:
      isolation: read-only
      writePaths: []
    prompt: |
      ADVERSARIAL VERIFICATION — pass 3 of 3, run in a separate node so it does not
      inherit the reasoning that produced the work.

      The phase "exploratory analysis" had this goal:
        characterize the dataset well enough that the planned tests are known to be applicable

      Re-derive whether the work actually achieves that goal. Hunt for the specific
      failure this phase is prone to: a profile that never checks the assumptions the next phase's tests depend on

      Be adversarial. FAIL it if the next phase could not proceed unambiguously on
      what this phase produced. Answer with exactly "PASS" or "FAIL: <reasons>".

  - id: stats
    name: Statistical analysis
    kind: agent
    terminal: false
    position: { x: 420, y: 740 }
    workspace:
      isolation: isolated-worktree
      writePaths:
        - analysis/stats
    limits:
      maxIterations: 8
      maxModelCalls: 8
    settings:
      version: 1
      skills:
        mode: auto-manual
        list:
          - statistical-analysis
          - statsmodels
          - pymc
    prompt: |
      Run the statistical comparisons and tests the plan named, on the data as the
      exploratory phase actually found it. For each test, state the assumption it
      makes, whether the data meets it, the effect size, and the uncertainty — not
      only the p-value. Write results under `analysis/stats/`.

      Where an assumption fails, either use a method that does not need it or report
      that the question cannot be answered with this data. Do not report a test you
      know to be inapplicable.

  - id: analysis-scribe
    name: Log the analysis phase
    kind: agent
    terminal: true
    position: { x: 760, y: 740 }
    workspace:
      isolation: isolated-worktree
      writePaths:
        - reports/analysis
    prompt: |
      Write a reproducible log of the analysis phase to `reports/analysis/`: the
      dataset version, every transformation applied, every test run with its
      parameters, and the exact commands. Someone repeating this phase from your log
      alone must obtain the same numbers.

  - id: stats-verify-1
    name: Verify statistical analysis (1 of 3)
    kind: agent
    terminal: false
    position: { x: 1100, y: 740 }
    workspace:
      isolation: read-only
      writePaths: []
    prompt: |
      ADVERSARIAL VERIFICATION — pass 1 of 3, run in a separate node so it does not
      inherit the reasoning that produced the work.

      The phase "statistical analysis" had this goal:
        answer the plan's comparisons with methods whose assumptions the data actually meets

      Re-derive whether the work actually achieves that goal. Hunt for the specific
      failure this phase is prone to: a significant result reported without its assumption check, its effect size, or its uncertainty

      Be adversarial. FAIL it if the next phase could not proceed unambiguously on
      what this phase produced. Answer with exactly "PASS" or "FAIL: <reasons>".

  - id: stats-verify-2
    name: Verify statistical analysis (2 of 3)
