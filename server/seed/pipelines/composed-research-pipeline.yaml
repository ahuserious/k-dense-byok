      The phase "literature search" had this goal:
        produce a cited synthesis that answers the plan's literature questions

      Re-derive whether the work actually achieves that goal. Hunt for the specific
      failure this phase is prone to: claims that carry no citation, and a corpus selected to agree with the hypothesis

      Be adversarial. FAIL it if the next phase could not proceed unambiguously on
      what this phase produced. Answer with exactly "PASS" or "FAIL: <reasons>".

  - id: lit-review-verify-3
    name: Verify literature search (3 of 3)
    kind: agent
    terminal: false
    position: { x: 80, y: 520 }
    workspace:
      isolation: read-only
      writePaths: []
    prompt: |
      ADVERSARIAL VERIFICATION — pass 3 of 3, run in a separate node so it does not
      inherit the reasoning that produced the work.

      The phase "literature search" had this goal:
        produce a cited synthesis that answers the plan's literature questions

      Re-derive whether the work actually achieves that goal. Hunt for the specific
      failure this phase is prone to: claims that carry no citation, and a corpus selected to agree with the hypothesis

      Be adversarial. FAIL it if the next phase could not proceed unambiguously on
      what this phase produced. Answer with exactly "PASS" or "FAIL: <reasons>".

  - id: eda
    name: Exploratory analysis
    kind: agent
    terminal: false
    position: { x: 420, y: 520 }
    workspace:
      isolation: isolated-worktree
      writePaths:
        - analysis/eda
    limits:
      maxIterations: 8
      maxModelCalls: 8
    settings:
      version: 1
      skills:
        mode: auto-manual
        list:
          - exploratory-data-analysis
          - polars
          - matplotlib
    prompt: |
      Run the exploratory phase on the uploaded dataset. Profile it first: shape,
      types, missingness, distributions, outliers, and anything that would invalidate
      the tests the plan proposes. Produce the figures and tables the plan asks for
      and write them under `analysis/eda/`.

      If the dataset is absent or does not match what the plan expected, stop and say
      so. Do not synthesize a dataset.

  - id: eda-verify-1
    name: Verify exploratory analysis (1 of 3)
    kind: agent
    terminal: false
    position: { x: 760, y: 520 }
    workspace:
      isolation: read-only
      writePaths: []
    prompt: |
      ADVERSARIAL VERIFICATION — pass 1 of 3, run in a separate node so it does not
      inherit the reasoning that produced the work.

      The phase "exploratory analysis" had this goal:
        characterize the dataset well enough that the planned tests are known to be applicable

      Re-derive whether the work actually achieves that goal. Hunt for the specific
      failure this phase is prone to: a profile that never checks the assumptions the next phase's tests depend on

      Be adversarial. FAIL it if the next phase could not proceed unambiguously on
      what this phase produced. Answer with exactly "PASS" or "FAIL: <reasons>".

  - id: eda-verify-2
    name: Verify exploratory analysis (2 of 3)
    kind: agent
    terminal: false
    position: { x: 1100, y: 520 }
    workspace:
      isolation: read-only
      writePaths: []
    prompt: |
      ADVERSARIAL VERIFICATION — pass 2 of 3, run in a separate node so it does not
