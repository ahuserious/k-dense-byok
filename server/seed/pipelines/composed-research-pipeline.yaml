  - id: evidence-gate
    name: Evidence gate
    kind: evidence-gate
    terminal: false
    position: { x: 760, y: 1180 }
    workspace:
      isolation: read-only
      writePaths: []
    checks:
      - citations
      - claim-support
      - artifact-exists
    artifactIds:
      - literature-log
      - analysis-log
      - eda-outputs
      - stats-outputs
    onUnsupportedOutput: fail
    evaluator:
      requested:
        source: fixed
        provider: openrouter
        model: anthropic/claude-opus-4.8
        auth:
          kind: api-key
        reasoning: high
      resolution:
