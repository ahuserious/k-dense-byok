  - id: synthesis
    name: Synthesize the findings
    kind: fusion
    terminal: false
    position: { x: 760, y: 960 }
    workspace:
      isolation: read-only
      writePaths: []
    settings:
      version: 1
      skills:
        mode: auto-manual
        list:
          - scientific-writing
          - scientific-critical-thinking
    goal: |
      Write the deliverable the plan named, drawing on the literature synthesis, the
      exploratory profile and the statistical results.

      Lead with what the work found. Then the methodology. Then the caveats, stated
      as plainly as the findings. Every claim traces either to a cited source or to a
      specific result from the analysis phase. A question the data could not answer is
      reported as unanswered, not softened.
    preserveMinorityReports: true
    fusion:
      mode: openrouter-router
      router:
        requested:
          source: fixed
          provider: openrouter
          model: openrouter/fusion
          auth:
            kind: api-key
          reasoning: high
        resolution:
